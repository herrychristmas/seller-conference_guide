<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Seller Growth Hub</title>
  
<style>
  :root{
    --bg:#000;
    --panel:#0c0d0f;
    --panel2:#111318;
    --text:#fff;
    --muted:#a7adb8;
    --line:#24272d;
    --lime:#d8ff00;
    --green:#20ea4d;
    --cyan:#5ee7f4;
    --blue:#1d66d7;
    --deepblue:#203b88;
    --radius:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#000;color:#fff}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Segoe UI",sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  button,a{font:inherit}
  button{cursor:pointer}
  .app{min-height:100vh;background:#000}
  .topbar{
    height:74px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;
    background:rgba(0,0,0,.88);backdrop-filter:blur(12px);z-index:20
  }
  
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .gmarket-logo{
    display:block;
    width:150px;
    height:auto;
    object-fit:contain;
  }
  .brand-copy{
    display:flex;
    flex-direction:column;
    line-height:1.1;
  }
  .brand-copy span{
    font-size:13px;
    font-weight:800;
    letter-spacing:.02em;
    color:#ffffff;
  }
  .brand-copy small{
    color:#7c828d;
    font-size:11px;
    font-weight:600;
    margin-top:3px;
  }
  .home-btn{
    display:none;align-items:center;gap:8px;border:1px solid #2e3238;background:#111318;color:#fff;
    padding:11px 16px;border-radius:999px
  }
  .home-btn.show{display:flex}

  .screen{display:none;width:100%;max-width:1500px;margin:0 auto;padding:26px 34px 46px}
  .screen.active{display:block}
  

  
  .hub-intro{
    margin:10px 4px 18px;
  }
  .title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:28px;
  }
  .hub-copy{
    flex:1;
    min-width:0;
  }
  .hub-intro h1{
    margin:0;
    font-size:clamp(30px,4.3vw,54px);
    line-height:1.08;
    letter-spacing:-.045em;
  }
  .hub-intro p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:16px;
    line-height:1.55;
    max-width:760px;
  }
  .next-stage-inline{
    flex-shrink:0;
    display:flex;
    align-items:flex-start;
    justify-content:flex-end;
    padding-top:2px;
  }
  .next-stage-mini{
    display:block;
    width:min(170px,17vw);
    min-width:115px;
    height:auto;
    object-fit:contain;
  }
  .hub-intro .hint{
    margin-top:10px;
    color:#7b818a;
    font-size:13px;
    text-align:right;
  }

  .hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .hub-card{
    min-height:205px;position:relative;border:1px solid var(--line);border-radius:var(--radius);
    background:#0b0c0e;padding:22px;overflow:hidden;text-align:left;color:#fff;transition:.16s ease
  }
  .hub-card:active{transform:scale(.985)}
  .hub-card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:4px;
    background:linear-gradient(90deg,var(--lime),var(--green),var(--cyan),var(--blue));
  }
  .hub-card::after{
    content:"";position:absolute;width:150px;height:150px;right:-52px;bottom:-56px;border-radius:22px;
    transform:rotate(45deg);opacity:.28;
    background:linear-gradient(135deg,var(--lime),var(--green),var(--cyan),var(--blue));
  }
  .hub-card:nth-child(2)::after{background:linear-gradient(135deg,var(--cyan),var(--blue),#27408f)}
  .hub-card:nth-child(3)::after{background:linear-gradient(135deg,var(--lime),var(--green),var(--deepblue))}
  .hub-card:nth-child(4)::after{background:linear-gradient(135deg,#fff,var(--cyan),var(--blue))}
  .hub-card:nth-child(5)::after{background:linear-gradient(135deg,var(--green),var(--cyan),#173985)}
  .hub-card:nth-child(6)::after{background:linear-gradient(135deg,var(--lime),var(--cyan),var(--blue))}

  .icon-wrap{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;margin-bottom:30px;
    background:#15171b;border:1px solid rgba(255,255,255,.08);position:relative;z-index:2
  }
  .accent{display:inline-block;width:34px;height:3px;border-radius:99px;margin-bottom:11px;
    background:linear-gradient(90deg,var(--lime),var(--cyan),var(--blue));position:relative;z-index:2}
  .hub-card h2{margin:0 0 8px;font-size:25px;letter-spacing:-.03em;position:relative;z-index:2}
  .hub-card p{margin:0;color:#a5abb3;font-size:14px;line-height:1.5;max-width:82%;position:relative;z-index:2}
  .hub-card .arrow{
    position:absolute;right:18px;bottom:16px;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;background:#fff;color:#000;font-weight:900;z-index:3
  }

  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:10px 0 22px}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;color:#d7dbe1;border:1px solid #282b31;background:#0f1114;
    border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;letter-spacing:.05em
  }
  .section-head h1{margin:13px 0 8px;font-size:clamp(32px,4.5vw,54px);line-height:1.08;letter-spacing:-.045em}
  .section-head p{margin:0;color:var(--muted);font-size:16px;line-height:1.55;max-width:840px}

  .content-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .content-card{
    min-height:310px;border:1px solid var(--line);background:#0c0d0f;border-radius:22px;overflow:hidden;
    display:flex;flex-direction:column
  }
  .thumb{
    height:112px;padding:18px;display:flex;align-items:flex-end;justify-content:space-between;
    background:
      linear-gradient(130deg,rgba(216,255,0,.10),transparent 35%),
      linear-gradient(310deg,rgba(94,231,244,.14),transparent 45%),
      #111318;
    border-bottom:1px solid rgba(255,255,255,.06)
  }
  .thumb .num{font-size:30px;font-weight:900;opacity:.20}
  .tag{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08)}
  .content-body{padding:20px;display:flex;flex-direction:column;flex:1}
  .content-body h3{margin:0 0 9px;font-size:20px;line-height:1.35;letter-spacing:-.025em}
  .content-body p{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
  .cta{margin-top:auto;padding-top:20px;display:flex;align-items:center;justify-content:space-between;font-weight:800}
  .footer-note{margin-top:22px;color:#6d737b;font-size:11px;text-align:center}

  @media(max-width:900px){
    .topbar{height:68px;padding:0 20px}.gmarket-logo{width:120px}
    .screen{padding:20px 20px 34px}
    .hub-intro{align-items:flex-start;flex-direction:column}
    .hub-intro .hint{display:none}.next-stage-mini{width:140px;min-width:140px}
    .hub-grid,.content-grid{grid-template-columns:repeat(2,1fr)}
    .hub-card{min-height:185px}
  }
  @media(max-width:620px){.title-row{gap:14px}.next-stage-mini{width:110px;min-width:110px}
    .hub-grid,.content-grid{grid-template-columns:1fr}
  }


  /* ===== Detail pages: NEXT STAGE key visual concept ===== */
  #categoryScreen{
    position:relative;
    overflow:hidden;
  }
  #categoryScreen::before{
    content:"";
    position:absolute;
    top:10px;
    right:-90px;
    width:330px;
    height:330px;
    border-radius:58px;
    transform:rotate(45deg);
    background:
      linear-gradient(135deg,
        rgba(216,255,0,.20) 0%,
        rgba(32,234,77,.16) 26%,
        rgba(94,231,244,.18) 55%,
        rgba(29,102,215,.20) 78%,
        rgba(32,59,136,.08) 100%);
    filter:blur(.2px);
    pointer-events:none;
    z-index:0;
  }
  #categoryScreen::after{
    content:"";
    position:absolute;
    top:178px;
    right:110px;
    width:120px;
    height:120px;
    border-radius:28px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.14),
      rgba(94,231,244,.12),
      rgba(29,102,215,.10));
    pointer-events:none;
    z-index:0;
  }

  #categoryScreen > *{
    position:relative;
    z-index:1;
  }

  .section-head{
    position:relative;
    margin:12px 0 28px;
    padding:30px 32px 28px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),
      #090a0c;
    overflow:hidden;
  }
  .section-head::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,var(--lime),var(--green),var(--cyan),var(--blue));
  }
  .section-head::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    right:28px;
    bottom:-84px;
    border-radius:26px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.32),
      rgba(32,234,77,.20),
      rgba(94,231,244,.18),
      rgba(29,102,215,.22));
  }

  .eyebrow{
    position:relative;
    z-index:2;
    border:1px solid rgba(255,255,255,.10);
    background:#101216;
    color:#e8ebef;
  }
  .eyebrow::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--lime),var(--cyan),var(--blue));
    box-shadow:0 0 14px rgba(94,231,244,.35);
  }

  .section-head h1{
    position:relative;
    z-index:2;
    margin:14px 0 10px;
  }
  .section-head h1::after{
    content:"";
    display:block;
    width:64px;
    height:4px;
    margin-top:18px;
    border-radius:999px;
    background:linear-gradient(90deg,var(--lime),var(--green),var(--cyan),var(--blue));
  }
  .section-head p{
    position:relative;
    z-index:2;
    max-width:760px;
  }

  .content-grid{
    position:relative;
    z-index:2;
  }
  .content-card{
    position:relative;
    border:1px solid rgba(255,255,255,.09);
    background:
      linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.004)),
      #0b0d10;
    box-shadow:0 14px 36px rgba(0,0,0,.20);
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .content-card::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:3px;
    background:linear-gradient(90deg,var(--lime),var(--green),var(--cyan),var(--blue));
    opacity:.9;
    z-index:3;
  }
  .content-card:active{
    transform:scale(.986);
  }
  .content-card:hover{
    border-color:rgba(94,231,244,.22);
    box-shadow:0 18px 42px rgba(0,0,0,.28);
  }

  .thumb{
    position:relative;
    background:
      radial-gradient(circle at 82% 20%,rgba(216,255,0,.12),transparent 24%),
      radial-gradient(circle at 65% 70%,rgba(94,231,244,.14),transparent 34%),
      linear-gradient(135deg,#14171c,#0c0e11);
  }
  .thumb::after{
    content:"";
    position:absolute;
    width:84px;
    height:84px;
    right:18px;
    top:14px;
    border-radius:20px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.18),
      rgba(32,234,77,.11),
      rgba(94,231,244,.13),
      rgba(29,102,215,.16));
  }
  .thumb .num,
  .thumb .tag{
    position:relative;
    z-index:2;
  }

  .content-body h3{
    font-size:21px;
  }
  .cta{
    color:#fff;
  }
  .cta span:last-child{
    width:32px;
    height:32px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#fff,#dfe5ec);
    color:#050607;
    font-weight:900;
  }

  .home-btn{
    border-color:rgba(255,255,255,.10);
    background:#0e1013;
  }
  .home-btn::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--lime),var(--cyan),var(--blue));
  }

  @media(max-width:900px){
    .section-head{
      padding:24px 22px 22px;
    }
    #categoryScreen::before{
      width:250px;
      height:250px;
      right:-110px;
    }
    #categoryScreen::after{
      display:none;
    }
  }

  .section-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:28px;
  }
  .detail-head-copy{
    flex:1;
    min-width:0;
  }
  .detail-next-stage{
    position:relative;
    z-index:2;
    display:block;
    width:min(145px,14vw);
    min-width:105px;
    height:auto;
    object-fit:contain;
    margin-top:3px;
    opacity:.95;
  }
  @media(max-width:700px){
    .detail-next-stage{
      width:105px;
      min-width:105px;
    }
  }



  /* ===== Thumbnail-led content layout ===== */
  .content-grid{
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }

  .content-card{
    min-height:0;
    border-radius:22px;
    overflow:hidden;
    background:#0b0d10;
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 14px 36px rgba(0,0,0,.22);
    cursor:pointer;
  }

  .content-card::before{
    height:3px;
  }

  .thumb{
    aspect-ratio:16/9;
    height:auto;
    min-height:0;
    padding:0;
    display:block;
    overflow:hidden;
    position:relative;
    background:#111318;
    border-bottom:1px solid rgba(255,255,255,.06);
  }

  .thumb::after{
    display:none;
  }

  .thumb-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.01);
  }

  .thumb-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.02) 36%,rgba(0,0,0,.56) 100%);
    pointer-events:none;
  }

  .thumb-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:18px;
    background:
      radial-gradient(circle at 78% 18%,rgba(216,255,0,.20),transparent 28%),
      radial-gradient(circle at 68% 72%,rgba(94,231,244,.22),transparent 34%),
      linear-gradient(135deg,#15181d,#0b0d10);
  }

  .thumb-placeholder::after{
    content:"";
    position:absolute;
    width:120px;
    height:120px;
    right:10px;
    top:4px;
    border-radius:26px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.36),
      rgba(32,234,77,.18),
      rgba(94,231,244,.22),
      rgba(29,102,215,.28));
  }

  .thumb-placeholder strong{
    position:relative;
    z-index:2;
    font-size:26px;
    line-height:1;
    letter-spacing:-.04em;
  }

  /* Actual page screenshots, framed like the advertising cards. */
  .thumb-page-preview{background:#fff;}
  .thumb-page-preview .thumb-image{object-position:top;transform:none;}
  .thumb-page-preview .thumb-overlay{background:linear-gradient(180deg,transparent 80%,rgba(0,0,0,.12));}
  .thumb-placeholder.thumb-pending{align-items:center;justify-content:center;background:#12151a;}
  .thumb-placeholder.thumb-pending::after{display:none;}
  .thumb-placeholder.thumb-pending strong{font-size:18px;font-weight:600;color:#8e97a4;letter-spacing:-.02em;}

  .thumb .tag{
    position:absolute;
    left:14px;
    top:14px;
    z-index:3;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(0,0,0,.68);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px);
    font-size:11px;
    font-weight:800;
  }

  .play-badge{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:54px;
    height:54px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(255,255,255,.20);
    box-shadow:0 8px 30px rgba(0,0,0,.28);
    z-index:3;
  }

  .play-badge::before{
    content:"";
    width:0;
    height:0;
    border-top:8px solid transparent;
    border-bottom:8px solid transparent;
    border-left:13px solid #fff;
    margin-left:3px;
  }

  .content-body{
    padding:18px 18px 17px;
    min-height:118px;
  }

  .content-body h3{
    margin:0;
    font-size:19px;
    line-height:1.4;
    letter-spacing:-.025em;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .content-body p{
    display:none;
  }

  .cta{
    margin-top:14px;
    padding-top:0;
    color:#9198a2;
    font-size:13px;
    font-weight:700;
  }

  .cta span:first-child{
    color:#9198a2;
  }

  .cta span:last-child{
    width:28px;
    height:28px;
    font-size:14px;
  }

  .content-card:hover .thumb-image{
    transform:scale(1.035);
    transition:transform .25s ease;
  }

  @media(max-width:900px){
    .content-grid{
      grid-template-columns:repeat(2,1fr);
    }
  }

  @media(max-width:620px){
    .content-grid{
      grid-template-columns:1fr;
    }
  }

  /* ===== Internal content detail ===== */
  #detailScreen{
    position:relative;
    overflow:hidden;
  }
  #detailScreen::before{
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    right:-120px;
    top:80px;
    border-radius:64px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.16),
      rgba(32,234,77,.12),
      rgba(94,231,244,.16),
      rgba(29,102,215,.18));
    pointer-events:none;
  }

  .detail-topbar{
    position:sticky;
    top:88px;
    z-index:10;
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:18px;
    margin-bottom:18px;
    padding:12px 14px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;
    background:rgba(8,10,13,.92);
    backdrop-filter:blur(14px);
    box-shadow:0 14px 34px rgba(0,0,0,.20);
  }
  .detail-topbar-center{
    min-width:0;
    text-align:center;
  }
  .detail-kicker{
    display:block;
    color:#7f8791;
    font-size:11px;
    font-weight:800;
    letter-spacing:.05em;
    margin-bottom:2px;
  }
  #detailTopTitle{
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:15px;
  }
  .detail-nav-btn{
    border:1px solid rgba(255,255,255,.11);
    background:#11141a;
    color:#fff;
    border-radius:999px;
    padding:11px 15px;
    font-weight:800;
    font-size:13px;
  }
  .detail-nav-btn.home{
    background:linear-gradient(90deg,var(--lime),var(--cyan));
    color:#060708;
    border-color:transparent;
  }

  .detail-stage{
    position:relative;
    z-index:1;
    max-width:1260px;
    margin:0 auto;
  }

  .detail-hero-card{
    position:relative;
    overflow:hidden;
    padding:30px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:26px;
    background:
      linear-gradient(160deg,rgba(216,255,0,.035),rgba(94,231,244,.025) 45%,rgba(29,102,215,.04)),
      #0a0c0f;
    box-shadow:0 18px 50px rgba(0,0,0,.26);
  }
  .detail-hero-card::before{
    content:"";
    position:absolute;
    left:0;top:0;width:100%;height:4px;
    background:linear-gradient(90deg,var(--lime),var(--green),var(--cyan),var(--blue));
  }
  .detail-hero-card h2{
    margin:0 0 10px;
    font-size:clamp(30px,4vw,50px);
    line-height:1.12;
    letter-spacing:-.045em;
  }
  .detail-hero-card p{
    margin:0;
    max-width:780px;
    color:#a8afb8;
    font-size:16px;

    height:100%;

  .video-local-fallback{

    padding:28px;
    background:#0b0d10;

  .video-local-fallback img{

    height:100%;

    border:1px solid rgba(255,255,255,.12);

    margin-bottom:10px;

  .video-local-copy p{

    display:block;

  .feature-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .feature-card{
    min-height:170px;

    border:1px solid rgba(255,255,255,.09);
    border-radius:20px;
    background:#0c0e12;
    position:relative;
    overflow:hidden;
  }
  .feature-card::after{
    content:"";
    position:absolute;
    width:110px;height:110px;
    right:-36px;bottom:-36px;
    border-radius:26px;
    transform:rotate(45deg);
    background:linear-gradient(135deg,
      rgba(216,255,0,.16),rgba(94,231,244,.12),rgba(29,102,215,.16));
  }
  .feature-card span{
    display:inline-block;
    margin-bottom:14px;

    font-size:12px;
    font-weight:900;
    letter-spacing:.05em;
  }
  .feature-card h3{
    position:relative;
    z-index:2;
    margin:0 0 8px;
    font-size:20px;
    line-height:1.4;
    letter-spacing:-.025em;
  }
  .feature-card p{
    position:relative;
    z-index:2;
    margin:0;
    color:#9fa6b0;
    font-size:14px;
    line-height:1.55;
  }
  .article-section{
    margin-top:18px;
    padding:26px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    background:#0b0d10;
  }
  .article-section-head{
    margin-bottom:16px;
  }
  .article-section-head span{
    display:block;
    color:#7fe7ef;
    font-size:12px;
    font-weight:900;
    letter-spacing:.05em;
    margin-bottom:7px;
  }
  .article-section-head h3{
    margin:0;
    font-size:25px;
    letter-spacing:-.03em;
  }
  .article-section img{
    width:100%;
    display:block;
    border-radius:16px;
  }
  .promo-row{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:18px;
    align-items:stretch;
  }
  .promo-copy{
    padding:28px;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.09);
    background:
      radial-gradient(circle at 85% 15%,rgba(216,255,0,.10),transparent 26%),
      linear-gradient(145deg,#101319,#090b0e);
  }
  .promo-copy span{
    color:#7fe7ef;
    font-size:12px;
    font-weight:900;
  }
  .promo-copy h3{
    margin:12px 0 10px;
    font-size:27px;
    line-height:1.25;
    letter-spacing:-.035em;
  }
  .promo-copy p{
    margin:0;
    color:#a6adb6;
    line-height:1.6;
  }
  .promo-row img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:22px;
    border:1px solid rgba(255,255,255,.09);
  }

  @media(max-width:900px){
    .detail-topbar{top:76px;}
    .feature-grid,.promo-row{grid-template-columns:1fr;}

    .detail-topbar{
      grid-template-columns:auto auto;
    }
    .detail-topbar-center{
      display:none;
    }
    .detail-hero-card{
      padding:22px;
    }
  }
